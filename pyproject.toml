[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Belt and braces alongside tests/conftest.py: no test may open a socket to
# anything but this machine. See WRITE_SAFETY.md.
addopts = "--allow-hosts=127.0.0.1,::1"

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "PYI", "RUF"]
ignore = [
  # Long lines are left to the author's judgement; the formatter is not run
  # over this repo and reflowing prose comments hurts more than it helps.
  "E501",
]

[tool.ruff.lint.per-file-ignores]
# Tests deliberately reach into internals and build throwaway objects.
"tests/*" = ["B008"]
